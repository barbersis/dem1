<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Barber One — Barbero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --tinta:#0A0A0C; --sup:#131316; --sup-2:#1A1A1F; --borde:#28282E; --borde-firme:#3A3A42;
    --ambar:#FFD60A; --ambar-claro:#FFE657; --ambar-tenue:rgba(255,214,10,.15);
    --cromo-1:#E9EBEF; --cromo-2:#8B909B; --cromo-3:#4A4E58;
    --texto:#F5F5F3; --texto-2:#9CA0A8; --texto-3:#5E6169;
    --verde:#22c55e; --rojo:#e05c5c;
    --display:'Jost',sans-serif; --cuerpo:'IBM Plex Sans',sans-serif; --cifra:'IBM Plex Mono',monospace;
    --resorte:cubic-bezier(.34,1.32,.44,1);

    /* alias heredados del diseño anterior (por compatibilidad) */
    --fondo:var(--tinta);
    --panel:var(--sup);
    --panel2:var(--sup-2);
    --texto-suave:var(--texto-2);
    --ambar-original:var(--ambar);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--tinta);
    color:var(--texto);
    font-family:var(--cuerpo);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  button{ font-family:inherit; }

  /* ===== AMBIENTE — glows a la deriva ===== */
  .ambiente{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .ambiente::before,.ambiente::after{content:'';position:absolute;width:340px;height:340px;border-radius:50%;
    filter:blur(80px);opacity:.22;animation:deriva 14s ease-in-out infinite;}
  .ambiente::before{background:var(--ambar);top:-140px;left:-100px}
  .ambiente::after{background:var(--ambar);bottom:-10%;right:-120px;animation-delay:-7s;animation-duration:17s}
  @keyframes deriva{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,50px) scale(1.15)}}

  /* ===== PLAFÓN — banda LED superior ===== */
  .plafon{position:fixed;top:0;left:0;right:0;height:3px;z-index:30;overflow:hidden;background:#000}
  .plafon::after{content:'';position:absolute;top:0;left:-40%;width:40%;height:100%;
    background:linear-gradient(90deg,transparent,var(--ambar-claro),var(--ambar),transparent);
    animation:correLuz 3.6s linear infinite;}
  @keyframes correLuz{0%{left:-40%}100%{left:100%}}

  @keyframes entra{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
  @keyframes rayaResp{0%,100%{opacity:.7}50%{opacity:1}}
  @keyframes sheen{from{background-position:-140% 0}to{background-position:240% 0}}
  @keyframes rayaExpande{from{width:0;opacity:0}to{width:120px;opacity:1}}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important}
  }

  /* ===== PANTALLA DE PIN ===== */
  #pantallaPin{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    position:relative;
    z-index:1;
  }
  .cajaPin{
    width:100%;
    max-width:340px;
    text-align:center;
    animation:entra .6s var(--resorte) both;
  }
  .logoPin{
    font-family:var(--display);
    font-size:38px;
    font-weight:400;
    letter-spacing:.04em;
    line-height:1.08;
    text-transform:uppercase;
  }
  .logoPin span{ color:var(--ambar); }
  .rayaPin{
    width:120px;height:2px;margin:16px auto 0;
    background:linear-gradient(90deg,transparent,var(--ambar),transparent);
    animation:rayaExpande .7s .25s var(--resorte) both, rayaResp 2.4s 1s ease-in-out infinite;
  }
  .subPin{
    color:var(--texto-2);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.14em;
    margin-top:14px;
    margin-bottom:30px;
  }

  .puntosPin{
    display:flex;
    justify-content:center;
    gap:16px;
    margin-bottom:30px;
  }
  .puntoPin{
    width:15px;
    height:15px;
    border-radius:50%;
    border:2px solid var(--borde-firme);
    transition:all 0.2s var(--resorte);
  }
  .puntoPin.lleno{
    background:var(--ambar);
    border-color:var(--ambar);
    box-shadow:0 0 0 4px var(--ambar-tenue),0 0 14px rgba(255,214,10,0.5);
    transform:scale(1.15);
  }
  .puntosPin.error .puntoPin{
    border-color:var(--rojo);
    background:transparent;
    box-shadow:none;
    transform:none;
  }

  .tecladoPin{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:14px;
    max-width:280px;
    margin:0 auto;
  }
  .tecla{
    aspect-ratio:1;
    border-radius:50%;
    border:1px solid var(--borde);
    background:var(--sup);
    color:var(--texto);
    font-family:var(--cifra);
    font-size:23px;
    font-weight:500;
    cursor:pointer;
    transition:background 0.15s ease, transform 0.08s var(--resorte), border-color .15s ease;
  }
  .tecla:active{
    background:linear-gradient(135deg,var(--ambar-claro),var(--ambar));
    color:var(--tinta);
    border-color:var(--ambar);
    transform:scale(0.95);
  }
  .tecla.accion{
    border:none;
    background:none;
    font-family:var(--cuerpo);
    font-size:14px;
    color:var(--texto-2);
  }
  .tecla.accion:active{
    background:none;
    color:var(--ambar);
    transform:scale(0.95);
  }
  #msgPin{
    color:var(--rojo);
    font-size:13px;
    margin-top:22px;
    min-height:18px;
  }

  /* ===== PANTALLA PRINCIPAL DEL BARBERO ===== */
  #pantallaBarbero{ display:none; position:relative; z-index:1; }
  header{
    padding:30px 20px 0;
    position:relative;
    z-index:1;
    animation:entra .6s var(--resorte) both;
  }
  .headerContenido{
    max-width:480px;
    margin:0 auto;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .h-kicker{
    font-family:var(--cifra);
    font-size:9.5px;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--texto-3);
    margin-bottom:6px;
  }
  #nombreBarbero{
    font-family:var(--display);
    font-size:27px;
    font-weight:400;
    letter-spacing:.02em;
    text-transform:uppercase;
  }
  #fechaHeader{
    color:var(--texto-2);
    font-size:12px;
    margin-top:6px;
  }
  #btnCerrarSesion{
    flex-shrink:0;
    background:var(--sup);
    border:1px solid var(--borde-firme);
    color:var(--texto-2);
    padding:9px 15px;
    border-radius:11px;
    font-size:13px;
    cursor:pointer;
    transition:border-color .2s ease, color .2s ease;
  }
  #btnCerrarSesion:hover{ border-color:var(--ambar); color:var(--texto); }
  .h-raya{
    max-width:480px;
    height:2px;
    margin:18px auto 0;
    background:linear-gradient(90deg,transparent,var(--ambar),transparent);
    opacity:.7;
  }
  main{
    padding:24px 20px 60px;
    max-width:480px;
    margin:0 auto;
  }

  /* ===== TARJETA CLIENTES HOY ===== */
  .cardClientes{
    background:var(--sup);
    border:1px solid var(--borde);
    border-radius:16px;
    padding:18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative;
    overflow:hidden;
    animation:popIn .4s var(--resorte) both;
  }
  .cardClientes::before{
    content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--ambar),transparent);
  }
  .cardClientes .textos .titulo{
    font-family:var(--cifra);
    font-size:9.5px;
    color:var(--texto-3);
    text-transform:uppercase;
    letter-spacing:.22em;
  }
  .cardClientes .textos .sub{
    font-size:13px;
    color:var(--texto-2);
    margin-top:6px;
  }
  #numClientes{
    font-family:var(--display);
    font-size:44px;
    font-weight:500;
    color:var(--texto);
    line-height:1;
  }
  #prodHoy{
    color:var(--ambar);
    font-weight:600;
  }

  .avance{
    background:var(--sup);
    border:1px dashed var(--borde-firme);
    border-radius:14px;
    padding:24px;
    text-align:center;
    color:var(--texto-2);
    font-size:13px;
    margin-top:16px;
  }

  /* ===== TÍTULOS DE SECCIÓN ===== */
  .tituloSeccion{
    font-family:var(--cifra);
    font-size:9.5px;
    color:var(--texto-3);
    text-transform:uppercase;
    letter-spacing:.22em;
    margin:28px 0 12px;
  }

  /* ===== TICKET ACTUAL ===== */
  .cardTicket{
    background:linear-gradient(135deg,rgba(255,214,10,.06),var(--sup) 60%);
    border:1px solid var(--borde-firme);
    border-radius:16px;
    padding:18px;
    position:relative;
    overflow:hidden;
  }
  .cardTicket::before{
    content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--ambar),transparent);
  }
  .filaTotal{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .filaTotal .textoTotal{
    color:var(--texto-2);
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.06em;
  }
  #totalTicket{
    font-family:var(--display);
    font-size:38px;
    font-weight:500;
    color:var(--ambar-claro);
    text-shadow:0 0 20px rgba(255,214,10,0.35);
  }
  #itemsTicket{
    margin-top:6px;
    display:flex;
    flex-direction:column;
  }
  .itemTicket{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:11px 0;
    border-top:1px solid var(--borde);
    font-size:14px;
  }
  .itemTicket .nomItem{
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .itemTicket .precioItem{ font-family:var(--cifra); font-weight:500; white-space:nowrap; }
  .btnQuitarItem{
    width:28px;
    height:28px;
    border-radius:50%;
    border:1px solid #5c3030;
    background:none;
    color:var(--rojo);
    font-size:13px;
    cursor:pointer;
    flex-shrink:0;
    transition:background .15s ease;
  }
  .btnQuitarItem:active{ background:rgba(224,92,92,.15); }

  /* ===== CATÁLOGO DE SERVICIOS ===== */
  .gridServicios{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .btnServicio{
    background:var(--sup);
    border:1px solid var(--borde);
    border-radius:14px;
    padding:15px;
    text-align:left;
    color:var(--texto);
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:transform .35s var(--resorte), border-color .3s ease, background .3s ease;
    animation:popIn .4s var(--resorte) both;
  }
  .btnServicio:active{
    border-color:var(--ambar);
    background:linear-gradient(135deg,rgba(255,214,10,.10),var(--sup) 60%);
    transform:scale(0.98);
  }
  .btnServicio .nomServ{
    font-size:14px;
    font-weight:500;
  }
  .btnServicio .precioServ{
    font-family:var(--cifra);
    color:var(--ambar);
    font-size:13px;
    font-weight:500;
    margin-top:6px;
  }

  /* ===== MONTO ESPECIAL ===== */
  .chipsConcepto{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:8px;
    margin-bottom:10px;
  }
  .chip{
    padding:11px 4px;
    font-size:12.5px;
    font-weight:500;
    border-radius:20px;
    border:1px solid var(--borde-firme);
    background:var(--sup);
    color:var(--texto-2);
    cursor:pointer;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    transition:all .25s var(--resorte);
  }
  .chip:active{ transform:scale(.96); }
  .chip.activo{
    background:var(--ambar-tenue);
    color:var(--ambar);
    border-color:var(--ambar);
    font-weight:600;
  }
  #especialConcepto{
    display:none;
    width:100%;
    padding:13px 14px;
    font-size:15px;
    font-family:var(--cuerpo);
    border-radius:11px;
    border:1px solid var(--borde);
    background:var(--sup);
    color:var(--texto);
    margin-bottom:10px;
    transition:border-color .3s ease, box-shadow .3s ease;
  }
  #especialConcepto::placeholder{ color:var(--texto-3); }
  #especialConcepto:focus{ outline:none; border-color:var(--ambar); box-shadow:0 0 0 4px var(--ambar-tenue); }
  .filaEspecial{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
  }
  #especialMonto{
    width:100%;
    padding:13px 14px;
    font-size:15px;
    font-family:var(--cifra);
    border-radius:11px;
    border:1px solid var(--borde);
    background:var(--sup);
    color:var(--texto);
    transition:border-color .3s ease, box-shadow .3s ease;
  }
  #especialMonto::placeholder{ color:var(--texto-3); font-family:var(--cuerpo); }
  #especialMonto:focus{ outline:none; border-color:var(--ambar); box-shadow:0 0 0 4px var(--ambar-tenue); }
  #especialAgregar{
    padding:13px 18px;
    font-size:14px;
    font-weight:600;
    border:1px solid var(--borde-firme);
    border-radius:11px;
    background:var(--sup-2);
    color:var(--texto);
    cursor:pointer;
    white-space:nowrap;
    transition:border-color .2s ease;
  }
  #especialAgregar:hover{ border-color:var(--ambar); }
  #especialMsg{
    color:var(--rojo);
    font-size:13px;
    margin-top:8px;
    min-height:16px;
  }

  /* ===== BOTÓN ENVIAR ===== */
  #btnEnviar{
    width:100%;
    margin-top:26px;
    padding:17px;
    font-size:15px;
    font-weight:700;
    border:none;
    border-radius:12px;
    position:relative;
    overflow:hidden;
    background:linear-gradient(135deg, var(--ambar-claro), var(--ambar));
    color:var(--tinta);
    cursor:pointer;
    box-shadow:0 10px 24px -8px rgba(255,214,10,0.5);
    transition:transform .2s var(--resorte);
  }
  #btnEnviar:active{ transform:scale(0.97); }
  #btnEnviar::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);
    background-size:200% 100%;animation:sheen 2.6s ease-in-out infinite;
  }
  #btnEnviar:disabled{
    background:var(--sup);
    color:var(--texto-3);
    box-shadow:none;
    border:1px solid var(--borde);
    cursor:default;
  }
  #btnEnviar:disabled::after{ display:none; }
  #notaEnviar{
    color:var(--texto-2);
    font-size:12px;
    text-align:center;
    margin-top:10px;
    min-height:16px;
  }

  /* ===== MIS TICKETS DE HOY ===== */
  #listaMisTickets{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .tarjetaMio{
    background:var(--sup);
    border:1px solid var(--borde);
    border-radius:14px;
    padding:13px 15px;
    animation:popIn .35s var(--resorte) both;
  }
  .tarjetaMio .filaMio{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .tarjetaMio .serviciosMio{
    flex:1;
    min-width:0;
    font-size:14px;
    font-weight:500;
  }
  .tarjetaMio .montoMio{
    font-family:var(--cifra);
    font-weight:500;
    font-size:16px;
    color:var(--ambar-claro);
    white-space:nowrap;
  }
  .tarjetaMio .horaMio{
    font-family:var(--cifra);
    color:var(--texto-3);
    font-size:11px;
    margin-top:4px;
  }
  .badge{
    display:inline-block;
    font-family:var(--cifra);
    font-size:10px;
    font-weight:500;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:4px 11px;
    border-radius:20px;
    margin-top:8px;
  }
  .badge.pendiente{ background:var(--ambar-tenue); color:var(--ambar-claro); border:1px solid rgba(255,214,10,.25); }
  .badge.cobrado{ background:rgba(34,197,94,.12); color:#7fe0a0; border:1px solid rgba(34,197,94,.28); }
  .accionesMio{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .btnMio{
    flex:1;
    padding:10px;
    font-size:13px;
    font-weight:500;
    border-radius:10px;
    border:1px solid var(--borde-firme);
    background:var(--sup-2);
    color:var(--texto);
    cursor:pointer;
    transition:border-color .2s ease;
  }
  .btnMio:hover{ border-color:var(--ambar); }
  .btnMio.rojo{
    border-color:#5c3030;
    color:var(--rojo);
  }
  .btnMio.rojo:hover{ border-color:var(--rojo); }
  .vacioMio{
    background:var(--sup);
    border:1px dashed var(--borde-firme);
    border-radius:14px;
    padding:20px;
    text-align:center;
    color:var(--texto-3);
    font-size:13px;
  }

  /* ===== MODAL DE MONTO (servicios "desde") ===== */
  .fondoModal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.78);
    backdrop-filter:blur(3px);
    z-index:100;
    align-items:flex-end;
    justify-content:center;
  }
  .fondoModal.abierto{ display:flex; }
  .modal{
    background:var(--sup);
    border:1px solid var(--borde-firme);
    border-radius:18px 18px 0 0;
    padding:22px 20px 30px;
    width:100%;
    max-width:480px;
    position:relative;
    overflow:hidden;
    animation:entra .35s var(--resorte) both;
  }
  .modal::before{
    content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--ambar),transparent);
  }
  @media(min-width:520px){
    .fondoModal{ align-items:center; }
    .modal{ border-radius:18px; }
  }
  .modal h3{ font-family:var(--display); font-weight:400; font-size:20px; margin-bottom:6px; }
  .modal .subModal{
    color:var(--texto-2);
    font-size:12.5px;
    margin-bottom:14px;
  }
  .modal label{
    display:block;
    font-family:var(--cifra);
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--texto-2);
    margin:14px 0 6px;
  }
  .modal input{
    width:100%;
    padding:14px;
    font-size:18px;
    font-family:var(--cifra);
    border-radius:11px;
    border:1px solid var(--borde);
    background:var(--tinta);
    color:var(--texto);
    text-align:center;
    transition:border-color .3s ease, box-shadow .3s ease;
  }
  .modal input:focus{ outline:none; border-color:var(--ambar); box-shadow:0 0 0 4px var(--ambar-tenue); }
  .btnModalPrincipal{
    width:100%;
    margin-top:16px;
    padding:15px;
    font-size:15px;
    font-weight:700;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,var(--ambar-claro),var(--ambar));
    color:var(--tinta);
    cursor:pointer;
    box-shadow:0 10px 24px -8px rgba(255,214,10,0.5);
    transition:transform .2s var(--resorte);
  }
  .btnModalPrincipal:active{ transform:scale(0.97); }
  .btnModalCancelar{
    width:100%;
    margin-top:10px;
    padding:12px;
    font-size:14px;
    background:none;
    border:1px solid var(--borde-firme);
    color:var(--texto-2);
    border-radius:11px;
    cursor:pointer;
    transition:border-color .2s ease;
  }
  .btnModalCancelar:hover{ border-color:var(--ambar); }
  .msgModal{
    color:var(--rojo);
    font-size:13px;
    margin-top:8px;
    min-height:16px;
    text-align:center;
  }

  #detalleError{
    display:none;
    margin-top:16px;
    background:#2a1a1a;
    border:1px solid #5c3030;
    border-radius:11px;
    padding:14px;
    font-size:13px;
    color:#e0a0a0;
    word-break:break-word;
  }
</style>
</head>
<body>

<div class="ambiente"></div>
<div class="plafon"></div>

    <div class="logoPin">The Barber<br><span>One</span></div>
    <div class="rayaPin"></div>
    <div class="subPin">Ingresa tu PIN de barbero</div>

    <div class="puntosPin" id="puntosPin">

      <div class="puntoPin"></div>

<div id="pantallaBarbero">

  </header>
  <main>
    <div class="cardClientes">
      <div class="textos">
        <div class="titulo">Clientes hoy</div>
        <div class="sub" id="subClientes">Aún sin clientes</div>
      </div>

    </div>

    <div class="tituloSeccion">Ticket actual</div>
    <div class="cardTicket">
      <div class="filaTotal">
        <span class="textoTotal">Total a cobrar</span>
        <span id="totalTicket">$0</span>
      </div>
      <div id="itemsTicket"></div>

    <div class="tituloSeccion">Servicios</div>

<!-- MODAL DE MONTO PARA SERVICIOS "DESDE" -->
<div class="fondoModal" id="modalMonto">
  <div class="modal">
    <h3 id="montoTitulo">Servicio</h3>
    <div class="subModal" id="montoSub">Ajusta el monto</div>
    <label>Monto ($)</label>
    <input type="number" id="montoInput" inputmode="numeric" min="0">
    <button class="btnModalPrincipal" id="montoAgregar">Agregar al ticket</button>
    <div class="msgModal" id="montoMsg"></div>
    <button class="btnModalCancelar" id="montoCancelar">Cancelar</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, getDocs, doc, getDoc, addDoc, deleteDoc,
    query, where, onSnapshot, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import {
    getAuth, setPersistence, browserLocalPersistence,
    onAuthStateChanged, signInWithCustomToken, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFunctions, httpsCallable
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

  // ##############################################################
  // #                                                            #
  // #   CONFIGURA AQUÍ POR CLIENTE  —  (lo único que se cambia)  #
  // #                                                            #
  // #   Pega la MISMA config de Firebase que pusiste en bg17.    #
  // #   Ambos archivos deben apuntar al mismo proyecto.          #
  // #   (El nombre del negocio se edita a mano en los títulos)   #
  // #                                                            #
  // ##############################################################
  const CONFIG = {
    firebase: {
      apiKey: "AIzaSyDK4jYc1XgHEkN6d-WvcSUyR4nhFWEgN74",
      authDomain: "demo1-37837.firebaseapp.com",
      projectId: "demo1-37837",
      appId: "1:71418270260:web:2cc80e1070355684aff061"
    }
  };
  // ##############################################################
  // #   FIN DE LA CONFIGURACIÓN — no edites nada abajo de aquí   #
  // ##############################################################

  const app = initializeApp(CONFIG.firebase);
  const db  = getFirestore(app);
  const auth = getAuth(app);
  const functions = getFunctions(app);
  const loginBarberoFn = httpsCallable(functions, "loginBarbero");

  // Persistencia local: la sesión de Firebase Auth se recuerda en
  // este dispositivo hasta que el barbero cierre sesión o caduque.
  setPersistence(auth, browserLocalPersistence);

  // authListo resuelve cuando onAuthStateChanged confirma el estado
  // inicial (haya o no sesión). Sirve para no confiar en el
  // localStorage de sesión hasta que Firebase Auth haya restaurado
  // (o no) una sesión real.
  let usuarioAuth = null;
  let resolverAuthListo;
  const authListo = new Promise(function(resolve){ resolverAuthListo = resolve; });
  onAuthStateChanged(auth, function(user){
    usuarioAuth = user;
    resolverAuthListo();
  });

  // ----- Fechas -----
  function fechaHoy(){
    const d = new Date();
    const a = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const dia = String(d.getDate()).padStart(2, "0");
    return a + "-" + m + "-" + dia;
  }
  function fechaLegible(){
    const t = new Date().toLocaleDateString("es-MX", { weekday:"long", day:"numeric", month:"long" });
    return t.charAt(0).toUpperCase() + t.slice(1);
  }
  document.getElementById("fechaHeader").textContent = fechaLegible();

  function formatoDinero(n){
    const r = Math.round(n * 100) / 100;
    return "$" + r.toLocaleString("es-MX");
  }

  // Suma la comisión del barbero en un ticket (lo que él gana,
  // NO lo que cobró el cliente). Lee it.comision de cada item.
  function comisionTicket(t){
    if(!t || !Array.isArray(t.items)) return 0;
    let total = 0;
    t.items.forEach(function(it){
      if(it && typeof it.comision === "number") total += it.comision;
    });
    return total;
  }

  function formatoHora(ts){
    if(!ts) return "";
    const d = ts.toDate();
    let h = d.getHours();
    const m = String(d.getMinutes()).padStart(2, "0");
    const ampm = h >= 12 ? "p.m." : "a.m.";
    h = h % 12; if(h === 0) h = 12;
    return h + ":" + m + " " + ampm;
  }

  // ============================================================
  // SESIÓN DEL BARBERO (5 horas por dispositivo)
  // ============================================================
  const CLAVE_SESION = "garageBarberoSesion";
  const DURACION_SESION = 5 * 60 * 60 * 1000; // 5 horas

  const pantallaPin     = document.getElementById("pantallaPin");
  const pantallaBarbero = document.getElementById("pantallaBarbero");
  const nombreBarberoEl = document.getElementById("nombreBarbero");
  const btnCerrarSesion = document.getElementById("btnCerrarSesion");
  const detalle         = document.getElementById("detalleError");

  let barberoActual = null;   // { num, nombre, vip, porcentaje, ... }
  let pararClientes = null;   // para detener el listener al cerrar sesión
  let pararPendientes = null; // listener de mis tickets pendientes

  function mostrarError(err){
    detalle.style.display = "block";
    detalle.textContent = "Detalle del error: " + err.message;
  }

  function leerSesion(){
    try{
      const s = JSON.parse(localStorage.getItem(CLAVE_SESION));
      if(!s || !s.num || !s.inicio) return null;
      if(Date.now() - s.inicio >= DURACION_SESION) return null;
      return s;
    } catch(e){ return null; }
  }

  function guardarSesion(num){
    localStorage.setItem(CLAVE_SESION, JSON.stringify({ num: num, inicio: Date.now() }));
  }

  function cerrarSesion(){
    localStorage.removeItem(CLAVE_SESION);
    if(pararClientes){ pararClientes(); pararClientes = null; }
    if(pararPendientes){ pararPendientes(); pararPendientes = null; }
    barberoActual = null;
    // Cerrar también la sesión de Firebase Auth (el custom token).
    signOut(auth).catch(function(){ /* sin sesión que cerrar, ok */ });
    pantallaBarbero.style.display = "none";
    pantallaPin.style.display = "flex";
    limpiarPin();
  }

  btnCerrarSesion.addEventListener("click", cerrarSesion);

  // ============================================================
  // ENTRAR: cargar datos del barbero y arrancar su pantalla
  // ============================================================
  // Recibe los datos del barbero que ya trajo la Cloud Function
  // (o los reconstruidos desde la sesión guardada). NO lee Firestore:
  // la colección "barberos" solo se toca del lado del servidor.
  async function entrarComoBarbero(datos){
    if(!datos || datos.num === undefined || datos.num === null){
      return false;
    }
    barberoActual = {
      num: datos.num,
      nombre: datos.nombre,
      metodoPago: datos.metodoPago
    };

    nombreBarberoEl.textContent = barberoActual.nombre || ("Barbero " + barberoActual.num);
    pantallaPin.style.display = "none";
    pantallaBarbero.style.display = "block";

    await cargarTabuladores();
    renderCatalogo();
    limpiarTicket();
    escucharClientesHoy();
    escucharMisPendientes();
    return true;
  }

  // ============================================================
  // CATÁLOGOS (regular y VIP)
  // ============================================================
  // ============================================================
  // CATÁLOGO DE JOSS — comisión fija por servicio (NO por %)
  // ------------------------------------------------------------
  // NUEVO MODELO (Gestor de barberos y nóminas):
  //   La comisión ya NO se decide por el NOMBRE del barbero, sino
  //   por su TABULADOR de pago (campo metodoPago en su documento).
  //
  //   SERVICIOS  → solo la ficha del servicio (id, nombre, precio).
  //                id  = clave estable para que nómina lea qué se hizo
  //                n   = nombre visible
  //                p   = precio que paga el cliente (va a la caja)
  //
  //   TABULADORES → cada tabulador dice cuánto gana el barbero por
  //                 cada servicio. Si un servicioId NO aparece en el
  //                 tabulador, ese barbero no ofrece ese servicio
  //                 (no ve el botón).
  //
  //   Los tabuladores REALES viven en Firestore (colección
  //   "tabuladores"), editables desde Admin. Lo de abajo es solo un
  //   RESPALDO para que la app funcione aunque la colección aún no
  //   se haya creado — se usa únicamente si Firestore no responde.
  // ============================================================
  const SERVICIOS_JOSS = [
    { id:"corte",        n:"Corte",                          p:250 },
    { id:"ritual",       n:"Ritual de barba",                p:260 },
    { id:"barbaexpress", n:"Barba express",                  p:180 },
    { id:"disenobarba",  n:"Diseño de barba",                p:120 },
    { id:"cejanavaja",   n:"Depilación de ceja con navaja",  p:100 },
    { id:"contornos",    n:"Limpieza de contornos",          p:100 },
    { id:"facial",       n:"Facial",                         p:200 },
    { id:"exfoliacion",  n:"Exfoliación",                    p:70  },
    // Exclusivos del dueño — solo el tabulador "joss" los incluye:
    { id:"tintebarba",   n:"Tinte de barba",                 p:200 },
    { id:"cortedama",    n:"Corte de dama",                  p:300 },
    { id:"cejahilo",     n:"Depilación de ceja con hilo",    p:200 }
  ];

  // Respaldo local de los tabuladores (mismos montos que antes).
  // metodo1 = rango Antony/Oliver/Cinthya · metodo2 = rango Homero
  // joss    = dueño: los 8 compartidos (rango Joss) + sus 3 exclusivos
  const TABULADORES_FALLBACK = {
    metodo1: {
      nombre: "Método 1",
      comisiones: { corte:80, ritual:80, barbaexpress:70, disenobarba:45, cejanavaja:40, contornos:40, facial:80, exfoliacion:28 }
    },
    metodo2: {
      nombre: "Método 2",
      comisiones: { corte:100, ritual:104, barbaexpress:72, disenobarba:48, cejanavaja:40, contornos:40, facial:80, exfoliacion:28 }
    },
    joss: {
      nombre: "Joss (dueño)",
      comisiones: { corte:100, ritual:104, barbaexpress:72, disenobarba:48, cejanavaja:40, contornos:40, facial:80, exfoliacion:28, tintebarba:80, cortedama:100, cejahilo:80 }
    }
  };

  // Tabuladores en memoria (se llenan desde Firestore al entrar).
  let TABULADORES = TABULADORES_FALLBACK;

  // Trae los tabuladores desde Firestore. Si no existen o falla,
  // se queda con el respaldo local (la app nunca se rompe).
  async function cargarTabuladores(){
    try{
      const snap = await getDocs(collection(db, "tabuladores"));
      if(snap.empty) return; // aún no migrado: usa el respaldo
      const cargados = {};
      snap.forEach(function(d){
        const data = d.data() || {};
        cargados[d.id] = {
          nombre: data.nombre || d.id,
          comisiones: data.comisiones || {}
        };
      });
      TABULADORES = cargados;
    } catch(e){
      // Sin conexión / sin permisos: seguimos con el respaldo local
      TABULADORES = TABULADORES_FALLBACK;
    }
  }

  // Devuelve el tabulador que le toca a un barbero. Compatibilidad:
  // si un barbero viejo aún no tiene metodoPago, lo deduce por nombre
  // (Homero/Joss → su tabulador; el resto → metodo1) para no dejar a
  // nadie sin servicios mientras se asignan los tabuladores en Admin.
  function tabuladorDe(barbero){
    let clave = barbero && barbero.metodoPago;
    if(!clave){
      const nom = (barbero && barbero.nombre) || "";
      if(nom === "Joss")       clave = "joss";
      else if(nom === "Homero") clave = "metodo2";
      else                      clave = "metodo1";
    }
    return TABULADORES[clave] || TABULADORES.metodo1 || { comisiones:{} };
  }

  const gridServicios = document.getElementById("gridServicios");

  function renderCatalogo(){
    const tab = tabuladorDe(barberoActual);
    const comisiones = tab.comisiones || {};

    // Solo se muestran los servicios que ofrece el TABULADOR de este barbero
    const disponibles = SERVICIOS_JOSS.filter(function(s){
      return comisiones[s.id] !== undefined;
    });

    gridServicios.innerHTML = "";
    disponibles.forEach(function(s){
      const btn = document.createElement("button");
      btn.className = "btnServicio";

      const nom = document.createElement("div");
      nom.className = "nomServ";
      nom.textContent = s.n;

      const precio = document.createElement("div");
      precio.className = "precioServ";
      precio.textContent = formatoDinero(s.p);

      btn.appendChild(nom);
      btn.appendChild(precio);

      btn.addEventListener("click", function(){
        agregarItem(s.n, s.p, s.id, comisiones[s.id]);
      });

      gridServicios.appendChild(btn);
    });
  }

  // ============================================================
  // TICKET ACTUAL
  // ============================================================
  const totalTicket = document.getElementById("totalTicket");
  const itemsTicket = document.getElementById("itemsTicket");
  const btnEnviar   = document.getElementById("btnEnviar");

  let itemsActuales = []; // [{concepto, monto, servicioId, comision}]

  function limpiarTicket(){
    itemsActuales = [];
    renderTicket();
  }

  // servicioId/comision son opcionales: los conceptos "especiales"
  // (Otro) no tiene comisión definida
  // todavía — quedan en null a propósito, NO se inventa un monto.
  function agregarItem(concepto, monto, servicioId, comision){
    itemsActuales.push({
      concepto: concepto,
      monto: monto,
      servicioId: servicioId || null,
      comision: (comision === undefined ? null : comision)
    });
    renderTicket();
  }

  function renderTicket(){
    let total = 0;
    itemsActuales.forEach(function(i){ total += i.monto; });
    totalTicket.textContent = formatoDinero(total);

    itemsTicket.innerHTML = "";
    itemsActuales.forEach(function(i, idx){
      const fila = document.createElement("div");
      fila.className = "itemTicket";

      const nom = document.createElement("span");
      nom.className = "nomItem";
      nom.textContent = i.concepto;

      const precio = document.createElement("span");
      precio.className = "precioItem";
      precio.textContent = formatoDinero(i.monto);

      const quitar = document.createElement("button");
      quitar.className = "btnQuitarItem";
      quitar.textContent = "✕";
      quitar.addEventListener("click", function(){
        itemsActuales.splice(idx, 1);
        renderTicket();
      });

      fila.appendChild(nom);
      fila.appendChild(precio);
      fila.appendChild(quitar);
      itemsTicket.appendChild(fila);
    });

    // Solo se puede enviar si hay servicios en el ticket
    btnEnviar.disabled = itemsActuales.length === 0;
  }

  // ============================================================
  // MODAL DE MONTO (servicios "desde")
  // ============================================================
  const modalMonto    = document.getElementById("modalMonto");
  const montoTitulo   = document.getElementById("montoTitulo");
  const montoSub      = document.getElementById("montoSub");
  const montoInput    = document.getElementById("montoInput");
  const montoAgregar  = document.getElementById("montoAgregar");
  const montoCancelar = document.getElementById("montoCancelar");
  const montoMsg      = document.getElementById("montoMsg");

  let servicioDesde = null;

  function abrirModalMonto(nombre, base){
    servicioDesde = nombre;
    montoTitulo.textContent = nombre;
    montoSub.textContent = "Precio desde " + formatoDinero(base) + " — ajusta el monto";
    montoInput.value = base;
    montoMsg.textContent = "";
    modalMonto.classList.add("abierto");
  }

  montoCancelar.addEventListener("click", function(){
    modalMonto.classList.remove("abierto");
    servicioDesde = null;
  });

  montoAgregar.addEventListener("click", function(){
    const monto = parseFloat(montoInput.value);
    if(isNaN(monto) || monto <= 0){
      montoMsg.textContent = "Escribe un monto válido";
      return;
    }
    agregarItem(servicioDesde, monto);
    modalMonto.classList.remove("abierto");
    servicioDesde = null;
  });

  // ============================================================
  // MONTO ESPECIAL (Producto / Otro)
  // ============================================================
  const chipsConcepto    = document.getElementById("chipsConcepto");
  const especialConcepto = document.getElementById("especialConcepto");
  const especialMonto    = document.getElementById("especialMonto");
  const especialAgregar  = document.getElementById("especialAgregar");
  const especialMsg      = document.getElementById("especialMsg");

  let conceptoEspecial = null;

  chipsConcepto.addEventListener("click", function(e){
    const chip = e.target.closest(".chip");
    if(!chip) return;
    chipsConcepto.querySelectorAll(".chip").forEach(function(c){
      c.classList.remove("activo");
    });
    chip.classList.add("activo");
    conceptoEspecial = chip.dataset.con;
    especialMsg.textContent = "";
    // Si es "Otro", pedir el nombre del servicio
    especialConcepto.style.display = conceptoEspecial === "Otro" ? "block" : "none";
  });

  especialAgregar.addEventListener("click", function(){
    const monto = parseFloat(especialMonto.value);

    if(conceptoEspecial === null){
      especialMsg.textContent = "Elige el concepto (Producto u Otro)";
      return;
    }
    let concepto = conceptoEspecial;
    if(conceptoEspecial === "Otro"){
      concepto = especialConcepto.value.trim();
      if(concepto === ""){
        especialMsg.textContent = "Escribe qué servicio es";
        return;
      }
    }
    if(isNaN(monto) || monto <= 0){
      especialMsg.textContent = "Escribe un monto válido";
      return;
    }

    // Producto: el monto capturado es lo que paga el cliente (va a caja),
    // pero la comisión del barbero SIEMPRE es $20 fijos, sin importar el monto.
    // Otro: sin comisión definida todavía (pendiente con Joss).
    const servicioId = conceptoEspecial === "Producto" ? "producto" : null;
    const comisionFija = conceptoEspecial === "Producto" ? 20 : null;

    agregarItem(concepto, monto, servicioId, comisionFija);

    // Limpiar el formulario especial
    especialMsg.textContent = "";
    especialMonto.value = "";
    especialConcepto.value = "";
    especialConcepto.style.display = "none";
    conceptoEspecial = null;
    chipsConcepto.querySelectorAll(".chip").forEach(function(c){
      c.classList.remove("activo");
    });
  });

  // ============================================================
  // ENVIAR TICKET A CAJA (colección "pendientes")
  // ============================================================
  const notaEnviar = document.getElementById("notaEnviar");
  let enviando = false;

  btnEnviar.addEventListener("click", async function(){
    if(enviando || itemsActuales.length === 0 || !barberoActual) return;

    enviando = true;
    btnEnviar.disabled = true;
    notaEnviar.style.color = "#9a9a9a";
    notaEnviar.textContent = "Enviando...";

    let total = 0;
    const nombres = [];
    const items = [];
    itemsActuales.forEach(function(i){
      total += i.monto;
      nombres.push(i.concepto);
      items.push({
        concepto: i.concepto,
        monto: i.monto,
        servicioId: i.servicioId,
        comision: i.comision
      });
    });

    try{
      await addDoc(collection(db, "pendientes"), {
        barbero: barberoActual.num,
        servicios: nombres,   // para mostrar en caja
        items: items,         // detalle para poder corregir desde aquí
        monto: total,
        fecha: fechaHoy(),
        origen: "bg18",
        creado: serverTimestamp()
      });
      limpiarTicket();
      notaEnviar.style.color = "#4caf50";
      notaEnviar.textContent = "Ticket enviado ✓ — recepción lo cobrará";
      setTimeout(function(){ notaEnviar.textContent = ""; }, 3500);
    } catch(err){
      notaEnviar.style.color = "#e05c5c";
      notaEnviar.textContent = "Error al enviar: " + err.message;
      btnEnviar.disabled = itemsActuales.length === 0;
    }
    enviando = false;
  });

  // ============================================================
  // MIS TICKETS DE HOY (pendientes + cobrados, tiempo real)
  // ============================================================
  const listaMisTickets = document.getElementById("listaMisTickets");
  let pendCache = [];
  let cobradosCache = [];
  let cancelandoId = null;   // pendiente esperando confirmación de cancelar
  let procesandoMio = false;

  function escucharMisPendientes(){
    const consulta = query(
      collection(db, "pendientes"),
      where("fecha", "==", fechaHoy()),
      where("barbero", "==", barberoActual.num)
    );
    pararPendientes = onSnapshot(consulta, function(snap){
      pendCache = [];
      snap.forEach(function(d){ pendCache.push({ id: d.id, ...d.data() }); });
      cancelandoId = null;
      renderMisTickets();
    }, function(err){ mostrarError(err); });
  }

  function renderMisTickets(){
    const todos = [];
    pendCache.forEach(function(p){ todos.push({ ...p, estado: "pendiente" }); });
    cobradosCache.forEach(function(c){ todos.push({ ...c, estado: "cobrado" }); });

    todos.sort(function(a, b){
      const ta = a.creado ? a.creado.toMillis() : Date.now();
      const tb = b.creado ? b.creado.toMillis() : Date.now();
      return tb - ta;
    });

    if(todos.length === 0){
      listaMisTickets.innerHTML = '<div class="vacioMio">Aún no has enviado tickets hoy.</div>';
      return;
    }

    listaMisTickets.innerHTML = "";
    todos.forEach(function(t){
      const tarjeta = document.createElement("div");
      tarjeta.className = "tarjetaMio";

      const fila = document.createElement("div");
      fila.className = "filaMio";

      const serv = document.createElement("div");
      serv.className = "serviciosMio";
      serv.textContent = t.estado === "cobrado"
        ? (t.concepto || "Cobro")
        : (Array.isArray(t.servicios) ? t.servicios.join(" + ") : "");

      const monto = document.createElement("div");
      monto.className = "montoMio";
      // Mostrar la COMISIÓN del barbero (lo que él gana), no lo que cobró el cliente
      monto.textContent = formatoDinero(comisionTicket(t));

      fila.appendChild(serv);
      fila.appendChild(monto);

      const hora = document.createElement("div");
      hora.className = "horaMio";
      hora.textContent = formatoHora(t.creado);

      const badge = document.createElement("span");
      badge.className = "badge " + t.estado;
      badge.textContent = t.estado === "cobrado" ? "Cobrado" : "Pendiente";

      tarjeta.appendChild(fila);
      tarjeta.appendChild(hora);
      tarjeta.appendChild(badge);

      // Solo los pendientes se pueden corregir o cancelar
      if(t.estado === "pendiente"){
        const acciones = document.createElement("div");
        acciones.className = "accionesMio";

        const btnCorregir = document.createElement("button");
        btnCorregir.className = "btnMio";
        btnCorregir.textContent = "Corregir";
        btnCorregir.addEventListener("click", function(){ corregirPendiente(t); });

        const btnCancelarT = document.createElement("button");
        btnCancelarT.className = "btnMio rojo";
        btnCancelarT.textContent = cancelandoId === t.id ? "¿Seguro? Toca de nuevo" : "Cancelar";
        btnCancelarT.addEventListener("click", function(){ cancelarPendiente(t); });

        acciones.appendChild(btnCorregir);
        acciones.appendChild(btnCancelarT);
        tarjeta.appendChild(acciones);
      }

      listaMisTickets.appendChild(tarjeta);
    });
  }

  // Corregir: regresa los servicios al ticket actual y quita el pendiente de caja
  async function corregirPendiente(t){
    if(procesandoMio) return;
    procesandoMio = true;
    try{
      // Verificar que siga pendiente (que recepción no lo haya cobrado justo ahora)
      const ref = doc(db, "pendientes", t.id);
      const s = await getDoc(ref);
      if(!s.exists()){
        notaEnviar.style.color = "#e05c5c";
        notaEnviar.textContent = "Ese ticket ya fue cobrado en caja";
        setTimeout(function(){ notaEnviar.textContent = ""; }, 3500);
        procesandoMio = false;
        return;
      }
      await deleteDoc(ref);

      // Regresar los servicios al ticket actual para editarlos
      if(Array.isArray(t.items) && t.items.length > 0){
        itemsActuales = t.items.map(function(i){
          return { concepto: i.concepto, monto: i.monto };
        });
      } else {
        itemsActuales = [{
          concepto: Array.isArray(t.servicios) ? t.servicios.join(" + ") : "Ticket",
          monto: t.monto
        }];
      }
      renderTicket();
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch(err){
      mostrarError(err);
    }
    procesandoMio = false;
  }

  // Cancelar: elimina el pendiente (con doble toque de confirmación)
  async function cancelarPendiente(t){
    if(procesandoMio) return;
    if(cancelandoId !== t.id){
      cancelandoId = t.id;
      renderMisTickets();
      return;
    }
    procesandoMio = true;
    try{
      const ref = doc(db, "pendientes", t.id);
      const s = await getDoc(ref);
      if(s.exists()){
        await deleteDoc(ref);
      }
    } catch(err){
      mostrarError(err);
    }
    cancelandoId = null;
    procesandoMio = false;
  }

  // ----- Clientes de hoy (tickets ya cobrados en caja) -----
  const numClientes = document.getElementById("numClientes");
  const subClientes = document.getElementById("subClientes");

  function escucharClientesHoy(){
    const consulta = query(
      collection(db, "tickets"),
      where("fecha", "==", fechaHoy()),
      where("barbero", "==", barberoActual.num)
    );
    pararClientes = onSnapshot(consulta, function(snap){
      cobradosCache = [];
      snap.forEach(function(d){
        cobradosCache.push({ id: d.id, ...d.data() });
      });
      numClientes.textContent = snap.size;
      if(snap.size === 0){
        subClientes.textContent = "Aún sin clientes";
      } else {
        subClientes.textContent = snap.size === 1 ? "1 servicio cobrado" : (snap.size + " servicios cobrados");
      }
      renderMisTickets();
    }, function(err){ mostrarError(err); });
  }

  // ============================================================
  // TECLADO DE PIN
  // ============================================================
  const puntosPin  = document.getElementById("puntosPin");
  const tecladoPin = document.getElementById("tecladoPin");
  const msgPin     = document.getElementById("msgPin");

  let pinActual = "";
  let validandoPin = false;

  function pintarPuntos(){
    const puntos = puntosPin.querySelectorAll(".puntoPin");
    puntos.forEach(function(p, i){
      p.classList.toggle("lleno", i < pinActual.length);
    });
  }

  function limpiarPin(){
    pinActual = "";
    puntosPin.classList.remove("error");
    msgPin.textContent = "";
    pintarPuntos();
  }

  async function validarPin(){
    if(validandoPin) return;
    validandoPin = true;
    msgPin.style.color = "#9a9a9a";
    msgPin.textContent = "Verificando...";

    try{
      // El PIN se valida en el SERVIDOR (Cloud Function loginBarbero).
      // Nunca leemos la colección "barberos" desde el navegador.
      const resp = await loginBarberoFn({ pin: pinActual });
      const datos = resp.data; // { token, num, nombre, metodoPago }

      // Iniciar sesión de Firebase Auth con el custom token que
      // devolvió la function (trae el claim barberoNum).
      await signInWithCustomToken(auth, datos.token);

      // Guardar sesión local y entrar con los datos que ya trajo la
      // function (entrarComoBarbero ya no vuelve a leer Firestore).
      guardarSesion(datos.num);
      await entrarComoBarbero({
        num: datos.num,
        nombre: datos.nombre,
        metodoPago: datos.metodoPago
      });
      limpiarPin();
    } catch(err){
      puntosPin.classList.add("error");
      msgPin.style.color = "#e05c5c";
      // La function manda "PIN incorrecto" o "PIN duplicado, avisa a
      // recepción" como mensaje; Firebase lo entrega en err.message.
      const codigo = err && err.code ? err.code : "";
      let texto = err && err.message ? err.message : "Error de conexión";
      if(codigo === "functions/permission-denied") texto = "PIN incorrecto";
      msgPin.textContent = texto;
      setTimeout(limpiarPin, 1200);
    }

    validandoPin = false;
  }

  tecladoPin.addEventListener("click", function(e){
    const btn = e.target.closest(".tecla");
    if(!btn || validandoPin) return;

    if(btn.dataset.accion === "limpiar"){
      limpiarPin();
      return;
    }
    if(btn.dataset.accion === "quitar"){
      pinActual = pinActual.slice(0, -1);
      puntosPin.classList.remove("error");
      msgPin.textContent = "";
      pintarPuntos();
      return;
    }
    if(pinActual.length >= 4) return;

    pinActual += btn.dataset.num;
    pintarPuntos();

    if(pinActual.length === 4){
      validarPin();
    }
  });

  // ============================================================
  // ARRANQUE: entrar directo SOLO si hay sesión local válida Y
  // Firebase Auth restauró una sesión real (con el claim del
  // barbero). Si falta cualquiera de las dos, se pide el PIN.
  // ============================================================
  (async function arranque(){
    const sesion = leerSesion();
    if(!sesion) return; // no hay sesión local → se queda en la pantalla de PIN

    // Esperar a que Firebase Auth confirme si hay sesión restaurada.
    await authListo;

    // Sin sesión real de Auth (p.ej. sesión vieja de antes de este
    // cambio, o expirada) → limpiar y pedir PIN de nuevo.
    if(!usuarioAuth){
      cerrarSesion();
      return;
    }

    // Verificar que el token corresponda al barbero de la sesión local.
    let numToken = null;
    try{
      const t = await usuarioAuth.getIdTokenResult();
      numToken = t.claims && t.claims.barberoNum;
    } catch(e){ /* token ilegible */ }

    if(numToken === null || numToken === undefined || Number(numToken) !== Number(sesion.num)){
      cerrarSesion();
      return;
    }

    // Reconstruir nombre/metodoPago leyendo el PROPIO doc del barbero
    // (lectura acotada permitida por las reglas: el barbero lee lo suyo).
    let nombre = "Barbero " + sesion.num;
    let metodoPago = null;
    try{
      const s = await getDoc(doc(db, "barberos", String(sesion.num)));
      if(s.exists()){
        const b = s.data();
        if(b.activo === false){ cerrarSesion(); return; }
        nombre = b.nombre || nombre;
        metodoPago = b.metodoPago || null;
      }
    } catch(e){ /* si falla la lectura, entra con datos mínimos */ }

    entrarComoBarbero({ num: sesion.num, nombre: nombre, metodoPago: metodoPago })
      .then(function(ok){ if(!ok) cerrarSesion(); })
      .catch(function(err){ mostrarError(err); });
  })();
</script>
